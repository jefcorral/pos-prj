services:
    app:
        build: .
        container_name: pos-app
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        volumes:
            - pos_storage:/var/www/html/storage

    nginx:
        image: nginx:alpine
        container_name: pos-nginx
        restart: unless-stopped
        ports:
            - '8080:80'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        depends_on:
            - app

    postgres:
        image: postgres:17-alpine
        container_name: pos-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-pos}
            POSTGRES_USER: ${DB_USERNAME:-pos}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - pos_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-pos}']
            interval: 5s
            timeout: 3s
            retries: 10
        ports:
            - '5432:5432'

    redis:
        image: redis:7-alpine
        container_name: pos-redis
        restart: unless-stopped
        ports:
            - '6379:6379'

    queue:
        build: .
        container_name: pos-queue
        restart: unless-stopped
        env_file: .env
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        command: php artisan queue:work --sleep=3 --tries=3
        depends_on:
            - app
        volumes:
            - pos_storage:/var/www/html/storage

volumes:
    pos_pgdata:
    pos_storage:
